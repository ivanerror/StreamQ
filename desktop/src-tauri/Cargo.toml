[package]
name = "streamq"
version = "2.0.0"
description = "Queue and download video/audio from YouTube"
authors = ["ivanerror"]
license = "MIT"
repository = "https://github.com/ivanerror/streamq"
edition = "2021"
rust-version = "1.80"

[lib]
name = "streamq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "fs"] }
process-wrap = { version = "10", features = ["tokio1"] }
# rustls with the ring provider: pure Rust/asm, so it builds on every CI runner without a C toolchain
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = "0.3"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
# Same version process-wrap uses, for its CreationFlags wrapper
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
