name: Release (2.x desktop)

# Builds StreamQ 2 for Windows (NSIS + MSI), macOS (universal .app/.dmg) and
# Linux (AppImage + deb) and publishes a GitHub Release. Start it either way:
#   - push a tag like v2.0.0 (must match the version in tauri.conf.json), or
#   - Actions → "Release (2.x desktop)" → Run workflow on main: the tag is taken
#     from tauri.conf.json and created when the release is published.
# Installers do not contain yt-dlp, FFmpeg or Deno: the app downloads them on
# first launch, which keeps every download small.
on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: version
        run: |
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version ($version)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create draft release (or reuse an existing draft)
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Drafts have no tag yet, so look them up in the release list rather than by tag
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          existing=${existing%%$'\n'*}
          if [ -n "$existing" ]; then
            read -r id draft <<< "$existing"
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published; bump the version in tauri.conf.json"
              exit 1
            fi
          else
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="StreamQ ${TAG#v}" \
              -F draft=true -F generate_release_notes=true --jq .id)
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
          - name: macos-universal
            os: macos-latest
            args: '--target universal-apple-darwin'
          # Older glibc keeps the Linux builds compatible with more distributions
          - name: linux
            os: ubuntu-22.04
            args: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Add checksums and version.json, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          api="repos/$GITHUB_REPOSITORY/releases"
          mkdir assets && cd assets
          # Work by release id: a draft cannot be looked up by its tag yet
          gh api "$api/$ID/assets" --paginate --jq '.[] | "\(.id) \(.name)"' |
            while read -r asset name; do
              gh api -H "Accept: application/octet-stream" "$api/assets/$asset" > "$name"
            done
          ls -la
          sha256sum * > SHA256SUMS.txt
          # Read by "Check for app update" in StreamQ's settings
          printf '{"version":"%s","url":"https://github.com/%s/releases/tag/%s"}\n' \
            "${TAG#v}" "$GITHUB_REPOSITORY" "$TAG" > version.json
          for file in SHA256SUMS.txt version.json; do
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/$api/$ID/assets?name=$file" --input "$file" --jq .name
          done
          # Publishing creates the tag on the commit the release targets
          gh api --method PATCH "$api/$ID" -F draft=false -f make_latest=true --jq .html_url
