name: Release

# Push a tag like v1.2.0 to build StreamQ for Windows, macOS and Linux and
# publish the files as a GitHub Release. Run manually to only build artifacts.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          # Older glibc keeps the Linux binary compatible with more distros
          - name: linux-x64
            os: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(PYTHONPATH=src python -c "import streamq; print(streamq.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match streamq.__version__ ($version)"
            exit 1
          fi

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Download FFmpeg to bundle
        run: python scripts/fetch_ffmpeg.py

      - name: Build
        run: pyinstaller --noconfirm --clean StreamQ.spec

      - name: Check bundled FFmpeg runs
        shell: bash
        run: |
          for name in ffmpeg ffprobe; do
            bin=$(find dist -type f \( -path "*/ffmpeg/$name" -o -path "*/ffmpeg/$name.exe" \) | head -1)
            if [ -z "$bin" ]; then echo "::error::$name missing from build"; exit 1; fi
            # Write to a file first: piping into head can SIGPIPE under pipefail
            "$bin" -version > version.txt && head -1 version.txt
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          7z a -tzip "release/StreamQ-${{ matrix.name }}-portable.zip" ./dist/StreamQ
          $env:PYTHONPATH = "src"
          $version = python -c "import streamq; print(streamq.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$version" installer\streamq.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist/installer/StreamQ-Setup-windows-x64.exe release/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir release
          ditto -c -k --keepParent dist/StreamQ.app "release/StreamQ-${{ matrix.name }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir release
          tar -czf "release/StreamQ-${{ matrix.name }}.tar.gz" -C dist StreamQ

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamQ-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
